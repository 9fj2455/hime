<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>🇻🇳 Việt Nam trong tôi</title>
  <link rel="stylesheet" type="text/css" href="style.css">
  <script type="text/javascript" src="script.js" defer></script>
</head>
<body>
  <div class="chat-wrapper">
    <header class="chat-header">
      <h1>🇻🇳 Việt Nam trong tôi</h1>
      <p class="subtitle">Lịch sử • Văn hóa • Truyền thống</p>
    </header>

    <main id="chat-box" class="chat-box"></main>

    <footer class="chat-footer">
      <input type="text" id="userInput" placeholder="Hãy trò chuyện về Việt Nam...">
      <button onclick="sendMessage()">➤</button>
    </footer>
  </div>
</body>
</html>
